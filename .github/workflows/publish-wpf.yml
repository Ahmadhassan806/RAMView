name: Build & Release WPF App

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # ----------------------------------------------------------
      # Build a self‑contained single‑file EXE
      # ----------------------------------------------------------
      - name: Publish self‑contained EXE
        run: |
          dotnet publish ./src/RAMView.App/RAMView.App.csproj \
            -c Release \
            -r win-x64 \
            --self-contained true \
            -p:PublishSingleFile=true \
            -p:IncludeNativeLibrariesForSelfExtract=true \
            -o publish
        shell: pwsh

      # ----------------------------------------------------------
      # Build an MSIX package (optional – requires a signing cert)
      # ----------------------------------------------------------
      - name: Publish MSIX package
        run: |
          dotnet publish ./src/RAMView.App/RAMView.App.csproj \
            -c Release \
            -r win-x64 \
            -p:GenerateAppxPackageOnBuild=true \
            -p:AppxPackageSigningEnabled=false \
            -o msix
        shell: pwsh

      - name: Sign MSIX (if certificate available)
        if: secrets.MSIX_CERTIFICATE && secrets.MSIX_CERT_PASSWORD
        env:
          CERT: ${{ secrets.MSIX_CERTIFICATE }}
          PASS: ${{ secrets.MSIX_CERT_PASSWORD }}
        run: |
          # Write the base64‑encoded .pfx to a temporary file
          $pfxPath = "$env:TEMP\cert.pfx"
          [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($env:CERT))
          # Locate the generated .msix (or .appx) file
          $msix = Get-ChildItem -Path msix -Filter "*.msix" -Recurse | Select-Object -First 1
          if ($msix) {
            "Signing $($msix.FullName)"
            signtool sign /fd SHA256 /f $pfxPath /p $env:PASS $msix.FullName
          } else {
            Write-Host "No MSIX package found – skipping signing."
          }
        shell: pwsh

      # ----------------------------------------------------------
      # Package assets for release
      # ----------------------------------------------------------
      - name: Archive EXE folder
        run: |
          Compress-Archive -Path publish\* -DestinationPath RAMView.zip
        shell: pwsh

      - name: Prepare release notes
        id: notes
        run: |
          echo "# Release ${{ github.ref_name }}" > notes.md
          echo "" >> notes.md
          git log -1 --pretty=format:"* %s" >> notes.md
          echo "" >> notes.md
          echo "[Full changelog](${{ github.server_url }}/${{ github.repository }}/compare/${{ github.ref_name }}...${{ github.sha }})" >> notes.md
        shell: pwsh

      - name: Create Release & Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "RAMView ${{ github.ref_name }}"
          body_path: notes.md
          files: |
            publish\RAMView.exe
            RAMView.zip
            msix\*.msix
          draft: false
          prerelease: false
