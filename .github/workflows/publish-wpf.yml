name: Build & Release WPF App

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Publish self-contained EXE
        run: dotnet publish ./src/RAMView.App/RAMView.App.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o publish
        shell: pwsh

      - name: Archive publish folder
        run: Compress-Archive -Path publish\* -DestinationPath RAMView.zip
        shell: pwsh

      - name: Prepare release notes
        run: |
          "# Release ${{ github.ref_name }}" | Out-File -FilePath notes.md -Encoding utf8
          "" | Out-File -FilePath notes.md -Append -Encoding utf8
          git log -1 --pretty=format:"* %s" | Out-File -FilePath notes.md -Append -Encoding utf8
        shell: pwsh

      - name: Create Release & Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "RAMView ${{ github.ref_name }}"
          body_path: notes.md
          files: |
            publish\RAMView.exe
            RAMView.zip
          draft: false
          prerelease: false
